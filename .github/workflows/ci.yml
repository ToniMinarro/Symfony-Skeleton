name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and start Docker stack
        run: make init
      - name: Validate application
        run: make validate
      - name: Smoke test HTTP runtime
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 http://localhost:8080/health
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans

  template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Copier
        run: pip install copier==9.17.0
      - name: Render lifecycle template
        run: |
          target="$RUNNER_TEMP/skeleton-overlay"
          copier copy --trust --defaults --vcs-ref HEAD --data project_name=Smoke --data project_slug=smoke . "$target"
          test -f "$target/.symfony-skeleton.yml"
          test -f "$target/.symfony-skeleton-version"
          test -f "$target/base/composer-requirements.json"
          test -f "$target/tools/base-sync.php"
          php -l template/tools/base-sync.php
