name: CI

on:
  # Validate every PR targeting main, including every new commit pushed to it.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Validate the exact commit that lands on main after a merge.
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Docker stack
        run: make init

      - name: Validate application
        run: make validate

      - name: Smoke test HTTP runtime
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 http://localhost:8080/health

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans
