name: Release base tag

on:
  create:

permissions:
  contents: write

jobs:
  tag:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create immutable template tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release branch: $GITHUB_REF_NAME"; exit 1; }
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Release branches must point at current main."; exit 1; }
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag $version already exists; tags are immutable."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$version" -m "Symfony-Skeleton $version"
          git push origin "$version"
          git push origin --delete "$GITHUB_REF_NAME"
