name: Refresh Symfony UX lock

on:
  push:
    branches:
      - agent/upgrade-symfony-ux-3
    paths:
      - composer.json

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/upgrade-symfony-ux-3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Refresh Symfony UX dependencies
        run: composer update symfony/ux-turbo symfony/stimulus-bundle --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Commit generated lock
        run: |
          rm .github/workflows/refresh-ux-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock .github/workflows/refresh-ux-lock.yml
          git commit -m "chore: refresh Symfony UX lock"
          git push
