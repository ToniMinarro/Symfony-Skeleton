name: Build versioned Copier base

on:
  push:
    branches:
      - agent/versioned-copier-base
    paths:
      - .github/workflows/build-versioned-base.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versioned-copier-base
          fetch-depth: 0

      - name: Build lifecycle-managed base
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p base tools template/.github/workflows template/.github template/base template/tools template/docs/base

          cat > copier.yml <<'EOF'
          _min_copier_version: "9.17.0"
          _subdirectory: template
          _answers_file: .symfony-skeleton.yml

          project_name:
            type: str
            default: Symfony App
            help: Human-readable application name.

          project_slug:
            type: str
            default: symfony-app
            help: Stable machine-readable project identifier.
          EOF

          cat > base/composer-requirements.json <<'EOF'
          {
            "require": {
              "php": ">=8.4",
              "ext-ctype": "*",
              "ext-iconv": "*",
              "ext-pdo": "*",
              "ext-pdo_pgsql": "*",
              "doctrine/dbal": "^4.3",
              "doctrine/doctrine-bundle": "^2.13",
              "doctrine/doctrine-migrations-bundle": "^3.4",
              "doctrine/orm": "^3.5",
              "symfony/asset": "7.4.*",
              "symfony/asset-mapper": "7.4.*",
              "symfony/console": "7.4.*",
              "symfony/dotenv": "7.4.*",
              "symfony/flex": "^2.6",
              "symfony/framework-bundle": "7.4.*",
              "symfony/runtime": "7.4.*",
              "symfony/security-bundle": "7.4.*",
              "symfony/stimulus-bundle": "^3.4",
              "symfony/twig-bundle": "7.4.*",
              "symfony/ux-turbo": "^3.4",
              "symfony/yaml": "7.4.*"
            },
            "require-dev": {
              "friendsofphp/php-cs-fixer": "^3.80",
              "phpstan/phpstan": "^2.1",
              "phpunit/phpunit": "^11.5",
              "symfony/browser-kit": "7.4.*",
              "symfony/css-selector": "7.4.*"
            },
            "extra": {
              "symfony": {
                "allow-contrib": false,
                "require": "7.4.*"
              }
            }
          }
          EOF

          cat > tools/base-sync.php <<'EOF'
          <?php

          declare(strict_types=1);

          $root = dirname(__DIR__);
          $manifestPath = $root.'/base/composer-requirements.json';
          $composerPath = $root.'/composer.json';

          if (!is_file($manifestPath) || !is_file($composerPath)) {
              fwrite(STDERR, "Missing base/composer-requirements.json or composer.json.\n");
              exit(1);
          }

          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $composer = json_decode((string) file_get_contents($composerPath), true, 512, JSON_THROW_ON_ERROR);

          foreach (['require', 'require-dev'] as $section) {
              $composer[$section] ??= [];
              foreach ($manifest[$section] ?? [] as $package => $constraint) {
                  $composer[$section][$package] = $constraint;
              }
              ksort($composer[$section]);
          }

          $composer['config'] ??= [];
          $composer['config']['optimize-autoloader'] = true;
          $composer['config']['sort-packages'] = true;
          $composer['config']['allow-plugins'] ??= [];
          $composer['config']['allow-plugins']['symfony/flex'] = true;
          $composer['config']['allow-plugins']['symfony/runtime'] = true;

          $composer['extra'] ??= [];
          $composer['extra']['symfony'] = $manifest['extra']['symfony'];

          file_put_contents(
              $composerPath,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR)."\n"
          );

          if (in_array('--packages', $argv, true)) {
              $packages = [];
              foreach (['require', 'require-dev'] as $section) {
                  foreach (array_keys($manifest[$section] ?? []) as $package) {
                      if (str_contains($package, '/')) {
                          $packages[] = $package;
                      }
                  }
              }
              sort($packages);
              echo implode(' ', array_unique($packages));
          }
          EOF

          cat > Makefile <<'EOF'
          UID := $(shell id -u)
          GID := $(shell id -g)
          COMPOSE_FILE := $(firstword $(wildcard compose.yaml docker-compose.yml))
          COMPOSE := docker compose $(if $(COMPOSE_FILE),-f $(COMPOSE_FILE),)
          APP ?= app
          COPIER ?= copier

          -include Makefile.app

          .PHONY: init build start stop down erase ps composer-install composer console migrate test-database test analyse check-style validate fix-style base-sync base-update shell bash logs

          init: build start composer-install migrate

          build:
          	$(COMPOSE) build

          start:
          	$(COMPOSE) up -d --wait

          stop:
          	$(COMPOSE) stop

          down:
          	$(COMPOSE) down --remove-orphans

          erase:
          	$(COMPOSE) down -v --remove-orphans

          ps:
          	$(COMPOSE) ps

          composer-install:
          	$(COMPOSE) exec -T -u $(UID):$(GID) -e COMPOSER_HOME=/tmp/composer $(APP) composer install --no-interaction

          composer:
          	$(COMPOSE) exec -T -u $(UID):$(GID) -e COMPOSER_HOME=/tmp/composer $(APP) composer $(CMD)

          console:
          	$(COMPOSE) exec -T $(APP) php bin/console $(CMD)

          migrate:
          	$(COMPOSE) exec -T $(APP) php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

          test-database:
          	$(COMPOSE) exec -T $(APP) php bin/console doctrine:database:create --env=test --if-not-exists
          	$(COMPOSE) exec -T $(APP) php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
          	$(COMPOSE) exec -T $(APP) php bin/console doctrine:migrations:up-to-date --env=test

          test: test-database
          	$(COMPOSE) exec -T $(APP) php vendor/bin/phpunit

          analyse:
          	$(COMPOSE) exec -T $(APP) php vendor/bin/phpstan analyse --memory-limit=512M

          check-style:
          	$(COMPOSE) exec -T $(APP) php vendor/bin/php-cs-fixer fix --dry-run --diff

          validate:
          	$(COMPOSE) exec -T -u $(UID):$(GID) -e COMPOSER_HOME=/tmp/composer $(APP) composer validate --strict
          	$(COMPOSE) exec -T $(APP) php bin/console lint:container
          	$(COMPOSE) exec -T $(APP) php bin/console lint:twig templates
          	$(COMPOSE) exec -T $(APP) php bin/console lint:yaml config
          	$(COMPOSE) exec -T $(APP) php bin/console doctrine:schema:validate --skip-sync
          	$(COMPOSE) exec -T $(APP) php bin/console debug:asset-map
          	$(MAKE) test
          	$(MAKE) analyse
          	$(MAKE) check-style

          fix-style:
          	$(COMPOSE) exec -T $(APP) php vendor/bin/php-cs-fixer fix

          base-sync:
          	$(COMPOSE) exec -T $(APP) php tools/base-sync.php
          	@packages="$$( $(COMPOSE) exec -T $(APP) php tools/base-sync.php --packages )"; \
          		$(COMPOSE) exec -T -u $(UID):$(GID) -e COMPOSER_HOME=/tmp/composer $(APP) composer update $$packages --with-all-dependencies --no-interaction --prefer-dist --no-progress

          base-update:
          	@command -v $(COPIER) >/dev/null 2>&1 || { echo "Copier >=9.17 is required. Install it with: pipx install copier  (or: uv tool install copier)"; exit 1; }
          	@test -f .symfony-skeleton.yml || { echo "This project is not yet linked to Symfony-Skeleton."; exit 1; }
          	$(COPIER) update --defaults --trust
          	$(MAKE) build
          	$(MAKE) start
          	$(MAKE) base-sync
          	$(MAKE) validate

          shell:
          	$(COMPOSE) exec -u $(UID):$(GID) $(APP) sh

          bash: shell

          logs:
          	$(COMPOSE) logs -f $(APP)
          EOF

          cat > docs/base-management.md <<'EOF'
          # Symfony-Skeleton lifecycle

          Symfony-Skeleton is the technical and architectural baseline for Minarro Labs Symfony applications.

          ## Ownership model

          The base owns cross-project technical policy: supported PHP/Symfony versions, common dependencies, quality tooling, the CI quality gate, the standard Make targets, pull-request hygiene, and the architecture/development guides copied under `docs/base/`.

          Product repositories own business capabilities, migrations, templates and browser behaviour specific to the product, security rules, integrations, deployment-provider configuration, and any product-only dependency. Product-specific Make targets belong in `Makefile.app` so the base `Makefile` can be updated without conflicts.

          ## Updating a consumer

          Consumer repositories contain `.symfony-skeleton.yml`, generated by Copier. From a clean branch run:

          ```bash
          make base-update
          ```

          The target runs `copier update`, synchronises the managed Composer constraints without deleting product dependencies, rebuilds the runtime and executes the complete application quality gate. Base updates must be delivered through a pull request and merged only with green CI.

          ## Versioning

          Stable template releases use immutable PEP 440-compatible Git tags (`v1.0.0`, `v1.1.0`, ...). Patch releases are compatible fixes, minor releases are compatible baseline improvements, and major releases may require an explicit migration in consuming applications.

          Do not edit `.symfony-skeleton.yml` manually. Let Copier update it so its smart-diff history remains valid.
          EOF

          cat >> README.md <<'EOF'

          ## Versioned application base

          This repository also publishes the lifecycle-managed technical overlay used by Minarro Labs Symfony applications. Existing applications adopt it with Copier and then receive compatible baseline changes with `make base-update`; application-specific dependencies and product code remain owned by the application. See `docs/base-management.md`.
          EOF

          cp .dockerignore template/.dockerignore
          cp .editorconfig template/.editorconfig
          cp .php-cs-fixer.dist.php template/.php-cs-fixer.dist.php
          cp .github/pull_request_template.md template/.github/pull_request_template.md
          cp phpstan.neon template/phpstan.neon
          cp Makefile template/Makefile
          cp base/composer-requirements.json template/base/composer-requirements.json
          cp tools/base-sync.php template/tools/base-sync.php
          cp docs/architecture.md template/docs/base/architecture.md
          cp docs/development.md template/docs/base/development.md
          cp docs/base-management.md template/docs/base-management.md

          cat > template/.symfony-skeleton.yml.jinja <<'EOF'
          # Managed by Copier. Do not edit manually.
          {{ _copier_answers|to_nice_yaml -}}
          EOF

          cat > template/.github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Build and start Docker stack
                  run: make init
                - name: Validate application
                  run: make validate
                - name: Smoke test HTTP runtime
                  run: curl --fail --silent --show-error --retry 5 --retry-delay 2 http://localhost:8080/health
                - name: Show Docker logs on failure
                  if: failure()
                  run: docker compose logs --no-color
                - name: Stop Docker stack
                  if: always()
                  run: docker compose down -v --remove-orphans
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = "      - name: Validate application\n        run: make validate\n"
          addition = marker + "\n      - name: Validate Copier lifecycle template\n        run: |\n          python3 -m pip install --user copier==9.17.0\n          export PATH=\"$HOME/.local/bin:$PATH\"\n          target=\"$RUNNER_TEMP/skeleton-overlay\"\n          copier copy --trust --defaults --vcs-ref HEAD --data project_name=Smoke --data project_slug=smoke . \"$target\"\n          test -f \"$target/.symfony-skeleton.yml\"\n          test -f \"$target/base/composer-requirements.json\"\n          test -f \"$target/tools/base-sync.php\"\n          php -l template/tools/base-sync.php\n"
          if marker not in text:
              raise SystemExit('CI insertion marker not found')
          path.write_text(text.replace(marker, addition, 1))
          PY

          rm .github/workflows/build-versioned-base.yml

      - name: Commit generated base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: make skeleton a versioned application base"
          git push origin HEAD:agent/versioned-copier-base
